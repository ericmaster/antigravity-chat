<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>antigravity chat</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --border: #262b38;
      --text: #e6e8ee;
      --muted: #8b93a7;
      --accent: #7c8cff;
      --user: #1d2535;
      --success: #3ad29f;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-y;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-left: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: block;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background .2s ease, box-shadow .2s ease;
    }

    header .dot.busy {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 140, 255, .14);
      animation: pulse 1.5s ease-in-out infinite;
    }

    header .dot.error {
      background: var(--danger);
    }

    @keyframes pulse {
      50% { opacity: .45; }
    }

    .model-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    header select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 16px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    header button {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    header button:focus-visible,
    header select:focus-visible,
    textarea:focus-visible,
    .send:focus-visible,
    .fs-btn-cancel:focus-visible,
    .fs-btn-select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      padding: 24px 0;
      -webkit-overflow-scrolling: touch;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .msg .avatar {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .msg.user .avatar {
      background: var(--user);
      color: var(--accent);
    }

    .msg.assistant .avatar {
      background: #20283b;
      color: #9fb0ff;
    }

    .msg .body {
      flex: 1;
      min-width: 0;
    }

    .msg .body p:first-child {
      margin-top: 0;
    }

    .msg .body p:last-child {
      margin-bottom: 0;
    }

    .msg .body pre {
      background: #0a0c12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    .msg .body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }

    .msg .body :not(pre)>code {
      background: #0a0c12;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .cursor::after {
      content: "▋";
      color: var(--accent);
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .composer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      max-height: 240px;
      min-height: 60px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .send {
      background: var(--accent);
      color: #0b0e16;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      min-width: 68px;
      transition: background .2s ease, opacity .2s ease;
    }

    .send.stop {
      background: var(--danger);
      color: #210b0b;
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .hint {
      max-width: 760px;
      margin: 6px auto 0;
      padding: 0 16px;
      color: var(--muted);
      font-size: 12px;
      transition: color .2s ease;
    }

    .hint[data-state="busy"] {
      color: var(--accent);
    }

    .hint[data-state="error"] {
      color: var(--danger);
    }

    .hint[data-state="ready"] {
      color: var(--success);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 12vh;
    }

    .empty h2 {
      color: var(--text);
      font-weight: 600;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Workspace picker button */
    .ws-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .ws-btn:hover {
      border-color: var(--accent);
    }

    /* Conversation ID pill button */
    .cid-btn {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cid-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .tool-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(124, 140, 255, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .token-metrics {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    /* Modal styling */
    .fs-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .fs-modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 540px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }

    .fs-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fs-modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .fs-modal-path {
      padding: 8px 16px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(124, 140, 255, 0.08);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }

    .fs-modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      min-height: 200px;
      max-height: 400px;
    }

    .fs-mrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .fs-mrow:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .fs-mrow.up {
      color: var(--accent);
      font-weight: 600;
    }

    .fs-mico {
      font-size: 14px;
    }

    .fs-mname {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fs-mtag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(124, 140, 255, 0.15);
      color: var(--accent);
      font-weight: 500;
    }

    .fs-mrow.empty, .fs-mrow.err {
      color: var(--muted);
      cursor: default;
      justify-content: center;
      padding: 20px;
    }

    .fs-mrow.err {
      color: #f87171;
    }

    .fs-modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fs-hint {
      font-size: 11px;
      color: var(--muted);
    }

    .fs-actions {
      display: flex;
      gap: 8px;
    }

    .fs-btn-cancel {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .fs-btn-select {
      background: var(--accent);
      color: #0b0e16;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .fs-btn-select:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .empty-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 16px rgba(124, 140, 255, 0.35));
    }

    /* Mobile Responsiveness */
    @media (max-width: 640px) {
      header {
        padding: 8px 10px;
        gap: 6px;
      }

      .brand {
        gap: 6px;
        min-width: 0;
      }

      .brand-logo {
        width: 24px;
        height: 24px;
      }

      header h1 {
        font-size: 14px;
      }

      .ws-btn {
        max-width: 110px;
        font-size: 12px;
        padding: 5px 8px;
      }

      .cid-btn {
        max-width: 90px;
        font-size: 11px;
        padding: 5px 8px;
      }

      header select {
        max-width: 125px;
        padding: 5px 8px;
      }

      header button {
        font-size: 12px;
        padding: 5px 8px;
      }

      #chat {
        padding: 14px 0;
      }

      .wrap {
        padding: 0 12px;
      }

      .composer {
        padding: 0 10px;
        gap: 8px;
      }

      textarea {
        font-size: 16px;
        padding: 10px 12px;
        min-height: 48px;
        max-height: 140px;
      }

      .send {
        padding: 0 14px;
        font-size: 13px;
        min-height: 48px;
      }

      .header-actions {
        gap: 4px;
      }

      .hint {
        padding: 0 10px;
        font-size: 11px;
      }

      .msg {
        gap: 10px;
        margin-bottom: 16px;
      }

      .msg .avatar {
        width: 26px;
        height: 26px;
        flex: 0 0 26px;
        font-size: 12px;
      }

      .msg .body pre {
        padding: 10px;
        font-size: 12px;
      }

      .empty-logo {
        width: 48px;
        height: 48px;
      }

      .empty h2 {
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      header h1 {
        display: none;
      }
      .ws-btn {
        max-width: 76px;
      }
      header select {
        max-width: 76px;
      }

      .cid-btn {
        width: 30px;
        max-width: 30px;
        padding: 5px 6px;
        overflow: hidden;
      }

      .cid-btn span {
        display: none;
      }

      #clear {
        width: 30px;
        padding: 5px 6px;
        font-size: 0;
      }

      #clear::after {
        content: "+";
        font-size: 17px;
        line-height: 1;
      }

      .header-actions {
        flex: 1;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img src="/static/logo.png" alt="Antigravity Logo" class="brand-logo" />
      <span id="status-dot" class="dot" title="Status: Ready"></span>
      <h1>Antigravity Chat</h1>
    </div>
    <div class="header-actions">
      <button id="cid-btn" class="cid-btn" style="display:none;" title="Active Conversation ID" aria-label="Active conversation">💬 <span id="cid-label"></span></button>
      <button id="ws-btn" class="ws-btn" title="Choose workspace folder" aria-label="Choose workspace folder">📁 <span id="ws-label">scratch</span></button>
      <div class="model-wrap">
        <span id="model-spinner" class="model-spinner" title="Loading models…" aria-label="Loading models"></span>
        <label class="sr-only" for="model">Model</label>
        <select id="model" title="Model" aria-label="Model" style="display:none;"></select>
      </div>
      <button id="clear" title="New chat" aria-label="Start a new chat">New chat</button>
    </div>
  </header>

  <main id="chat" role="log" aria-label="Conversation">
    <div class="wrap">
      <div class="empty">
        <img src="/static/logo.png" alt="Antigravity Logo" class="empty-logo" />
        <h2>Antigravity Chat</h2>
        <p>Powered by the <code>agy</code> CLI with token streaming & conversation state.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" aria-describedby="hint" placeholder="Message antigravity…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send" id="send" type="button">Send</button>
    </div>
    <div class="hint" id="hint" data-state="ready" role="status" aria-live="polite">Ready · streaming via agy</div>
  </footer>

  <div id="fs-modal" class="fs-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="fs-modal-title">
    <div class="fs-modal-card">
      <div class="fs-modal-header">
        <h3 id="fs-modal-title">Workspace Folder Picker</h3>
        <button class="fs-btn-cancel" type="button" aria-label="Close folder picker" onclick="closePicker()">✕</button>
      </div>
      <div id="fs-modal-path" class="fs-modal-path">(workspace roots)</div>
      <div id="fs-modal-list" class="fs-modal-list"></div>
      <div class="fs-modal-footer">
        <span class="fs-hint">Click a folder to enter · "Open this folder" selects current</span>
        <div class="fs-actions">
          <button class="fs-btn-cancel" type="button" onclick="closePicker()">Cancel</button>
          <button class="fs-btn-select" id="fs-modal-open" type="button" onclick="pickHere()">Open this folder ✓</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (window.marked) marked.setOptions({ breaks: true });
    const $ = (s) => document.querySelector(s);
    const chat = $("#chat"), input = $("#input"), sendBtn = $("#send"),
      modelSel = $("#model"), hint = $("#hint"), cidBtn = $("#cid-btn"), cidLabel = $("#cid-label"),
      statusDot = $("#status-dot");
    let messages = [];      // {role, content, tool, metrics, status}
    let busy = false;
    let activeController = null;
    let currentCwd = localStorage.getItem("agy_cwd") || "";
    const urlConversationId = new URLSearchParams(location.search).get("cid");
    let currentConversationId = urlConversationId || localStorage.getItem("agy_conversation_id") || null;
    let userId = localStorage.getItem("agy_user_id");
    if (!userId) {
      userId = "user_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("agy_user_id", userId);
    }
    let fsModalPath = "", fsModalEntries = [], fsModalUp = null, pickerReturnFocus = null;

    function updateConversationPill() {
      if (currentConversationId) {
        cidLabel.textContent = currentConversationId.length > 12
          ? currentConversationId.slice(0, 8) + "…"
          : currentConversationId;
        cidBtn.title = "Conversation ID: " + currentConversationId;
        cidBtn.style.display = "inline-flex";
      } else {
        cidBtn.style.display = "none";
      }
      const url = new URL(location.href);
      if (currentConversationId) {
        url.searchParams.set("cid", currentConversationId);
      } else {
        url.searchParams.delete("cid");
      }
      history.replaceState(null, "", url);
    }

    function updateWorkspacePill() {
      const label = $("#ws-label");
      if (!currentCwd) {
        label.textContent = "scratch";
        label.title = "Default scratch folder";
      } else {
        const parts = currentCwd.split("/");
        let display = currentCwd;
        if (parts[1] === "home" && parts[2]) {
          const home = "/home/" + parts[2];
          if (currentCwd.startsWith(home)) {
            display = "~" + currentCwd.slice(home.length);
          }
        }
        label.textContent = display;
        label.title = currentCwd;
      }
    }

    function setStatus(text, state = "ready") {
      hint.textContent = text;
      hint.dataset.state = state;
      statusDot.className = "dot" + (state === "busy" ? " busy" : state === "error" ? " error" : "");
      statusDot.title = state === "busy" ? "Status: Streaming" : state === "error" ? "Status: Error" : "Status: Ready";
    }

    function openPicker() {
      const modal = $("#fs-modal");
      pickerReturnFocus = document.activeElement;
      modal.style.display = "flex";
      requestAnimationFrame(() => modal.querySelector(".fs-btn-cancel")?.focus());
      browseModal(currentCwd || "");
    }

    function closePicker() {
      $("#fs-modal").style.display = "none";
      if (pickerReturnFocus && typeof pickerReturnFocus.focus === "function") pickerReturnFocus.focus();
      pickerReturnFocus = null;
    }

    async function browseModal(path) {
      try {
        const r = await fetch("/api/fs?path=" + encodeURIComponent(path || ""));
        const d = await r.json();
        if (d.detail) {
          $("#fs-modal-list").innerHTML = `<div class="fs-mrow err">${escapeHtml(d.detail)}</div>`;
          return;
        }
        fsModalPath = d.path || "";
        fsModalEntries = d.entries || [];
        fsModalUp = d.up === undefined ? null : d.up;

        let displayPath = fsModalPath;
        if (fsModalPath) {
          const parts = fsModalPath.split("/");
          if (parts[1] === "home" && parts[2]) {
            const homeStr = "/home/" + parts[2];
            if (fsModalPath.startsWith(homeStr)) {
              displayPath = "~" + fsModalPath.slice(homeStr.length);
            }
          }
        }
        $("#fs-modal-path").textContent = displayPath || "(workspace roots)";
        $("#fs-modal-open").disabled = !fsModalPath;

        let rows = "";
        if (fsModalUp !== null) {
          rows += `<div class="fs-mrow up" onclick="navUp()">↑ ${fsModalUp ? ".." : "workspace roots"}</div>`;
        }
        rows += fsModalEntries.map((e, i) =>
          `<div class="fs-mrow" onclick="navInto(${i})">
            <span class="fs-mico">${e.is_project ? "📦" : "📁"}</span>
            <span class="fs-mname">${escapeHtml(e.name)}</span>
            ${e.is_project ? '<span class="fs-mtag">project</span>' : ''}
          </div>`
        ).join("");

        $("#fs-modal-list").innerHTML = rows || '<div class="fs-mrow empty">(no subfolders)</div>';
      } catch (e) {
        $("#fs-modal-list").innerHTML = `<div class="fs-mrow err">fs error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function navInto(i) {
      const e = fsModalEntries[i];
      if (e) browseModal(e.path);
    }

    function navUp() {
      if (fsModalUp !== null) browseModal(fsModalUp);
    }

    function pickHere() {
      if (!fsModalPath) return;
      currentCwd = fsModalPath;
      localStorage.setItem("agy_cwd", currentCwd);
      updateWorkspacePill();
      closePicker();
    }

    $("#ws-btn").onclick = openPicker;
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("#fs-modal").style.display === "flex") closePicker();
    });
    updateWorkspacePill();
    updateConversationPill();

    function md(text) {
      if (!window.DOMPurify) return escapeHtml(text || "");
      const raw = window.marked ? window.marked.parse(text || "") : escapeHtml(text || "");
      return DOMPurify.sanitize(raw);
    }

    function isNearBottom() {
      return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
    }

    function scrollToBottom(force = false) {
      if (force || isNearBottom()) {
        requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
      }
    }

    function render(forceScroll = false) {
      const stickToBottom = forceScroll || isNearBottom();
      const wrap = document.createElement("div");
      wrap.className = "wrap";
      if (messages.length === 0) {
        chat.innerHTML = `<div class="wrap"><div class="empty"><img src="/static/logo.png" alt="Antigravity Logo" class="empty-logo" /><h2>Antigravity Chat</h2>
       <p>Powered by the <code>agy</code> CLI with token streaming & conversation state.</p></div></div>`;
        return;
      }
      for (const m of messages) {
        const el = document.createElement("div");
        el.className = "msg " + m.role;
        let toolHtml = m.tool ? `<div class="tool-badge">🛠️ Tool: ${escapeHtml(m.tool)}</div>` : "";
        let metricsHtml = m.metrics ? `<div class="token-metrics">📊 Tokens: ${escapeHtml(m.metrics)}</div>` : "";
        const live = m.role === "assistant" ? ' aria-live="polite"' : "";
        el.innerHTML = `<div class="avatar">${m.role === "user" ? "U" : "A"}</div>
      <div class="body"${live}>${m.role === "user" ? escapeHtml(m.content) : md(m.content)}${toolHtml}${metricsHtml}</div>`;
        wrap.appendChild(el);
      }
      chat.innerHTML = "";
      chat.appendChild(wrap);
      if (stickToBottom) scrollToBottom(true);
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
        .replace(/\n/g, "<br>");
    }

    const modelSpinner = $("#model-spinner");

    async function loadModels() {
      modelSpinner.style.display = "block";
      modelSel.style.display = "none";
      const maxRetries = 3;
      const baseDelay = 500;
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const r = await fetch("/api/models");
          if (r.ok) {
            const { models } = await r.json();
            if (Array.isArray(models) && models.length > 0) {
              modelSel.innerHTML = "";
              for (const m of models) {
                const o = document.createElement("option");
                o.value = m.id;
                o.textContent = m.name;
                modelSel.appendChild(o);
              }
              modelSpinner.style.display = "none";
              modelSel.style.display = "";
              return;
            }
          }
        } catch {
          // ignore error and retry
        }
        if (attempt < maxRetries - 1) {
          await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, attempt)));
        }
      }
      modelSel.innerHTML = "<option value=\'default\'>Default</option>";
      modelSpinner.style.display = "none";
      modelSel.style.display = "";
    }

    function updateComposer() {
      sendBtn.textContent = busy ? "Stop" : "Send";
      sendBtn.classList.toggle("stop", busy);
      sendBtn.setAttribute("aria-label", busy ? "Stop response" : "Send message");
      sendBtn.disabled = false;
    }

    function appendError(message, label, detail) {
      const text = `_${label}: ${detail || "Unknown error"}_`;
      if (!message.content.includes(text)) message.content += `\n\n${text}`;
    }

    function refreshAssistantBody(message, bodyEl) {
      if (!bodyEl) return;
      bodyEl.innerHTML = md(message.content);
      if (message.tool) {
        const badge = document.createElement("div");
        badge.className = "tool-badge";
        badge.textContent = "🛠️ Tool: " + message.tool;
        bodyEl.appendChild(badge);
      }
      if (message.metrics) {
        const badge = document.createElement("div");
        badge.className = "token-metrics";
        badge.textContent = "📊 Tokens: " + message.metrics;
        bodyEl.appendChild(badge);
      }
    }

    function handleStreamEvent(data, assistant, bodyEl) {
      if (!data || data.event === "done") return;

      if (data.event === "start") {
        setStatus("Starting agy…", "busy");
      } else if (data.event === "init" && data.conversation_id) {
        currentConversationId = data.conversation_id;
        localStorage.setItem("agy_conversation_id", currentConversationId);
        updateConversationPill();
      } else if (data.event === "delta" || data.delta) {
        const chunk = data.delta || data.text || "";
        if (!chunk) return;
        assistant.content += String(chunk);
        assistant.status = "streaming";
        refreshAssistantBody(assistant, bodyEl);
        setStatus("Streaming response…", "busy");
        scrollToBottom();
      } else if (data.event === "thinking") {
        setStatus("Thinking…", "busy");
      } else if (data.event === "tool" || data.tool) {
        const toolName = data.tool || data.name || "executing";
        assistant.tool = toolName;
        setStatus(`Using ${toolName}…`, "busy");
        refreshAssistantBody(assistant, bodyEl);
      } else if (data.event === "result") {
        if (!assistant.content && data.response) {
          assistant.content = String(data.response);
        }
        if (data.usage) {
          const u = data.usage;
          const total = u.total_tokens ?? ((u.input_tokens || 0) + (u.output_tokens || 0));
          assistant.metrics = `${total} tokens (${u.input_tokens || 0} in / ${u.output_tokens || 0} out)`;
        }
        refreshAssistantBody(assistant, bodyEl);
        setStatus("Finishing…", "busy");
      } else if (data.event === "error" || data.error) {
        assistant.status = "error";
        appendError(assistant, "Error", data.error);
        refreshAssistantBody(assistant, bodyEl);
        setStatus("Request failed", "error");
      }
    }

    function handleSseBlock(block, assistant, bodyEl) {
      const line = block.split(/\r?\n/).find((value) => value.startsWith("data:"));
      if (!line) return;
      const payload = line.slice(5).trim();
      if (!payload || payload === "[DONE]") return;
      try {
        handleStreamEvent(JSON.parse(payload), assistant, bodyEl);
      } catch (e) {
        console.warn("Error parsing stream event", e);
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      activeController = new AbortController();
      updateComposer();
      setStatus("Starting…", "busy");
      messages.push({ role: "user", content: text });
      input.value = ""; input.style.height = "60px";
      const assistant = { role: "assistant", content: "", status: "streaming" };
      messages.push(assistant);
      const requestMessages = messages.slice(0, -1).map(({ role, content }) => ({ role, content }));
      render(true);
      const bodyEl = chat.querySelector(".msg.assistant:last-child .body");
      if (bodyEl) bodyEl.classList.add("cursor");

      try {
        const resp = await fetch("/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: requestMessages,
            model: modelSel.value || "default",
            cwd: currentCwd || null,
            conversation_id: currentConversationId || null,
            continue_conversation: !!currentConversationId,
            user_id: userId,
          }),
          signal: activeController.signal,
        });
        if (!resp.ok) {
          const detail = await resp.text().catch(() => "");
          throw new Error(detail || `Request failed (${resp.status})`);
        }
        if (!resp.body) throw new Error("Server returned no response stream");
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const events = buf.split(/\r?\n\r?\n/);
          buf = events.pop();
          for (const ev of events) handleSseBlock(ev, assistant, bodyEl);
        }
        buf += dec.decode();
        if (buf.trim()) {
          handleSseBlock(buf, assistant, bodyEl);
        }
      } catch (e) {
        if (e.name === "AbortError") {
          assistant.status = "stopped";
          appendError(assistant, "Stopped", "Response cancelled");
          setStatus("Response stopped", "ready");
        } else {
          assistant.status = "error";
          appendError(assistant, "Connection error", e.message);
          setStatus("Connection error", "error");
        }
      } finally {
        if (bodyEl) bodyEl.classList.remove("cursor");
        if (assistant.status === "streaming") assistant.status = "complete";
        activeController = null;
        busy = false;
        updateComposer();
        if (assistant.status === "complete") setStatus("Ready · streaming via agy", "ready");
        render();
        input.focus();
      }
    }

    function stop() {
      if (activeController) activeController.abort();
    }

    function clearChat() {
      if (busy) stop();
      messages = [];
      currentConversationId = null;
      localStorage.removeItem("agy_conversation_id");
      updateConversationPill();
      fetch("/api/conversations?user_id=" + encodeURIComponent(userId), { method: "DELETE" }).catch(() => {});
      render();
      input.focus();
    }

    sendBtn.onclick = () => (busy ? stop() : send());
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "60px";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    });
    $("#clear").onclick = clearChat;

    loadModels();
    input.focus();
  </script>
</body>

</html>

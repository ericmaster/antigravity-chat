<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>antigravity chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --border: #262b38;
      --text: #e6e8ee;
      --muted: #8b93a7;
      --accent: #7c8cff;
      --user: #1d2535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .2px;
    }

    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3ad29f;
    }

    header select {
      margin-left: auto;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }

    header button {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .msg .avatar {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .msg.user .avatar {
      background: var(--user);
      color: var(--accent);
    }

    .msg.assistant .avatar {
      background: #20283b;
      color: #9fb0ff;
    }

    .msg .body {
      flex: 1;
      min-width: 0;
    }

    .msg .body p:first-child {
      margin-top: 0;
    }

    .msg .body p:last-child {
      margin-bottom: 0;
    }

    .msg .body pre {
      background: #0a0c12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    .msg .body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }

    .msg .body :not(pre)>code {
      background: #0a0c12;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .cursor::after {
      content: "▋";
      color: var(--accent);
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 0;
    }

    .composer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      line-height: 1.5;
      max-height: 240px;
      min-height: 60px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .send {
      background: var(--accent);
      color: #0b0e16;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .hint {
      max-width: 760px;
      margin: 6px auto 0;
      padding: 0 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 12vh;
    }

    .empty h2 {
      color: var(--text);
      font-weight: 600;
    }

    /* Workspace picker button */
    .ws-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-left: auto;
    }

    .ws-btn:hover {
      border-color: var(--accent);
    }

    /* Modal styling */
    .fs-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .fs-modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 540px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }

    .fs-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fs-modal-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .fs-modal-path {
      padding: 8px 16px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(124, 140, 255, 0.08);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }

    .fs-modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      min-height: 200px;
      max-height: 400px;
    }

    .fs-mrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .fs-mrow:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .fs-mrow.up {
      color: var(--accent);
      font-weight: 600;
    }

    .fs-mico {
      font-size: 14px;
    }

    .fs-mname {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fs-mtag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(124, 140, 255, 0.15);
      color: var(--accent);
      font-weight: 500;
    }

    .fs-mrow.empty, .fs-mrow.err {
      color: var(--muted);
      cursor: default;
      justify-content: center;
      padding: 20px;
    }

    .fs-mrow.err {
      color: #f87171;
    }

    .fs-modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fs-hint {
      font-size: 11px;
      color: var(--muted);
    }

    .fs-actions {
      display: flex;
      gap: 8px;
    }

    .fs-btn-cancel {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .fs-btn-select {
      background: var(--accent);
      color: #0b0e16;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .fs-btn-select:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <header>
    <span class="dot"></span>
    <h1>Antigravity Chat</h1>
    <button id="ws-btn" class="ws-btn" title="Choose workspace folder">📁 <span id="ws-label">scratch</span></button>
    <select id="model" title="Model"></select>
    <button id="clear" title="New chat">New chat</button>
  </header>

  <div id="chat">
    <div class="wrap">
      <div class="empty">
        <h2>Antigravity Chat</h2>
        <p>Powered by the <code>agy</code> CLI. Pick a model and say hello.</p>
      </div>
    </div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Message antigravity…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="hint" id="hint">Stateless: the full conversation is re-sent each turn.</div>
  </footer>

  <div id="fs-modal" class="fs-modal-overlay">
    <div class="fs-modal-card">
      <div class="fs-modal-header">
        <h3>Workspace Folder Picker</h3>
        <button class="fs-btn-cancel" onclick="closePicker()">✕</button>
      </div>
      <div id="fs-modal-path" class="fs-modal-path">(workspace roots)</div>
      <div id="fs-modal-list" class="fs-modal-list"></div>
      <div class="fs-modal-footer">
        <span class="fs-hint">Click a folder to enter · "Open this folder" selects current</span>
        <div class="fs-actions">
          <button class="fs-btn-cancel" onclick="closePicker()">Cancel</button>
          <button class="fs-btn-select" id="fs-modal-open" onclick="pickHere()">Open this folder ✓</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    marked.setOptions({ breaks: true });
    const $ = (s) => document.querySelector(s);
    const chat = $("#chat"), input = $("#input"), sendBtn = $("#send"),
      modelSel = $("#model"), hint = $("#hint");
    let messages = [];      // {role, content}
    let busy = false;
    let currentCwd = localStorage.getItem("agy_cwd") || "";
    let fsModalPath = "", fsModalEntries = [], fsModalUp = null;

    function updateWorkspacePill() {
      const label = $("#ws-label");
      if (!currentCwd) {
        label.textContent = "scratch";
        label.title = "Default scratch folder";
      } else {
        const parts = currentCwd.split("/");
        let display = currentCwd;
        if (parts[1] === "home" && parts[2]) {
          const home = "/home/" + parts[2];
          if (currentCwd.startsWith(home)) {
            display = "~" + currentCwd.slice(home.length);
          }
        }
        label.textContent = display;
        label.title = currentCwd;
      }
    }

    function openPicker() {
      $("#fs-modal").style.display = "flex";
      browseModal(currentCwd || "");
    }

    function closePicker() {
      $("#fs-modal").style.display = "none";
    }

    async function browseModal(path) {
      try {
        const r = await fetch("/api/fs?path=" + encodeURIComponent(path || ""));
        const d = await r.json();
        if (d.detail) {
          $("#fs-modal-list").innerHTML = `<div class="fs-mrow err">${escapeHtml(d.detail)}</div>`;
          return;
        }
        fsModalPath = d.path || "";
        fsModalEntries = d.entries || [];
        fsModalUp = d.up === undefined ? null : d.up;

        let displayPath = fsModalPath;
        if (fsModalPath) {
          const parts = fsModalPath.split("/");
          if (parts[1] === "home" && parts[2]) {
            const homeStr = "/home/" + parts[2];
            if (fsModalPath.startsWith(homeStr)) {
              displayPath = "~" + fsModalPath.slice(homeStr.length);
            }
          }
        }
        $("#fs-modal-path").textContent = displayPath || "(workspace roots)";
        $("#fs-modal-open").disabled = !fsModalPath;

        let rows = "";
        if (fsModalUp !== null) {
          rows += `<div class="fs-mrow up" onclick="navUp()">↑ ${fsModalUp ? ".." : "workspace roots"}</div>`;
        }
        rows += fsModalEntries.map((e, i) =>
          `<div class="fs-mrow" onclick="navInto(${i})">
            <span class="fs-mico">${e.is_project ? "📦" : "📁"}</span>
            <span class="fs-mname">${escapeHtml(e.name)}</span>
            ${e.is_project ? '<span class="fs-mtag">project</span>' : ''}
          </div>`
        ).join("");

        $("#fs-modal-list").innerHTML = rows || '<div class="fs-mrow empty">(no subfolders)</div>';
      } catch (e) {
        $("#fs-modal-list").innerHTML = `<div class="fs-mrow err">fs error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function navInto(i) {
      const e = fsModalEntries[i];
      if (e) browseModal(e.path);
    }

    function navUp() {
      if (fsModalUp !== null) browseModal(fsModalUp);
    }

    function pickHere() {
      if (!fsModalPath) return;
      currentCwd = fsModalPath;
      localStorage.setItem("agy_cwd", currentCwd);
      updateWorkspacePill();
      closePicker();
    }

    $("#ws-btn").onclick = openPicker;
    updateWorkspacePill();

    function md(text) { return DOMPurify.sanitize(marked.parse(text || "")); }

    function render() {
      const wrap = document.createElement("div");
      wrap.className = "wrap";
      if (messages.length === 0) {
        chat.innerHTML = `<div class="wrap"><div class="empty"><h2>antigravity chat</h2>
      <p>Powered by the <code>agy</code> CLI. Pick a model and say hello.</p></div></div>`;
        return;
      }
      for (const m of messages) {
        const el = document.createElement("div");
        el.className = "msg " + m.role;
        el.innerHTML = `<div class="avatar">${m.role === "user" ? "U" : "A"}</div>
      <div class="body">${m.role === "user" ? escapeHtml(m.content) : md(m.content)}</div>`;
        wrap.appendChild(el);
      }
      chat.innerHTML = "";
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
        .replace(/\n/g, "<br>");
    }

    async function loadModels() {
      const maxRetries = 3;
      const baseDelay = 500;
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          const r = await fetch("/api/models");
          if (r.ok) {
            const { models } = await r.json();
            if (Array.isArray(models) && models.length > 0) {
              modelSel.innerHTML = "";
              for (const m of models) {
                const o = document.createElement("option");
                o.value = m; o.textContent = m; modelSel.appendChild(o);
              }
              return;
            }
          }
        } catch {
          // ignore error and retry
        }
        if (attempt < maxRetries - 1) {
          await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, attempt)));
        }
      }
      modelSel.innerHTML = "<option>default</option>";
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true; sendBtn.disabled = true;
      messages.push({ role: "user", content: text });
      input.value = ""; input.style.height = "60px";
      messages.push({ role: "assistant", content: "" });
      render();
      const bodyEl = chat.querySelector(".msg.assistant:last-child .body");
      if (bodyEl) bodyEl.classList.add("cursor");

      try {
        const resp = await fetch("/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages.slice(0, -1), model: modelSel.value, cwd: currentCwd || null }),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const events = buf.split("\n\n");
          buf = events.pop();
          for (const ev of events) {
            const line = ev.split("\n").find(l => l.startsWith("data: "));
            if (!line) continue;
            const data = JSON.parse(line.slice(6));
            if (data.delta) {
              messages[messages.length - 1].content += data.delta;
              if (bodyEl) { bodyEl.innerHTML = md(messages[messages.length - 1].content); }
              chat.scrollTop = chat.scrollHeight;
            } else if (data.error) {
              messages[messages.length - 1].content += "\n\n_Error: " + data.error + "_";
            }
          }
        }
      } catch (e) {
        messages[messages.length - 1].content += "\n\n_Connection error: " + e.message + "_";
      } finally {
        if (bodyEl) bodyEl.classList.remove("cursor");
        render();
        busy = false; sendBtn.disabled = false; input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "60px";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    });
    $("#clear").onclick = () => { messages = []; render(); input.focus(); };

    loadModels();
    input.focus();
  </script>
</body>

</html>
